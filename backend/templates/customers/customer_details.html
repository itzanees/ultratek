<div class="card shadow-lg border-0 mb-4">
    <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center py-3">
        <h4 class="mb-0">{{ customer.company_name }}</h4>
    </div>

    <div class="card-body bg-white">
        <ul class="list-group list-group-flush">
            <li class="list-group-item">{{ customer.customer_code }}</li>
            <li class="list-group-item">{{ customer.contact_person }}</li>
            <li class="list-group-item"><a href="mailto:{{ customer.email }}">{{ customer.email }}</a></li>
            <li class="list-group-item"><a href="tel:{{ customer.phone_number }}">{{ customer.phone_number }}</a></li>
            <li class="list-group-item">{{ customer.billing_address }}</li>
        </ul>
    </div>
</div>

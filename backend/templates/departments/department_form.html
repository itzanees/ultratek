{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}
Create Department
{% endblock %}


{% block content %}

<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h5 class="mb-0">Create New Department</h5>
            </div>
            <div class="card-body bg-white p-4">

                <form method="post" novalidate>
                    {% csrf_token %}

                    {{ form|crispy }}


                    <div class="d-flex justify-content-between pt-2">
                        <a href="{% url 'departments_home' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Department</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}


{% block scripts %}
<!-- Include Choices.js JavaScript script file dependencies -->
<script>
    $(document).ready(function () {
        $('#id_manager').select2({
            theme: 'bootstrap-5',
            placeholder: "Search for an employee...",
            allowClear: true
        });
    });
</script>

{% endblock %}

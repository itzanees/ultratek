{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Add New Employee Profile</h4>
            </div>
            <div class="card-body">

                <!-- The form element must use method="post" -->
                <form method="post" novalidate>
                    {% csrf_token %} <!-- Essential security token against CSRF threats -->
                    {{ form|crispy }}
                    <div class="text-end mt-3">
                        <button type="submit" class="btn btn-success px-4">Save Employee Record</button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}




{% block scripts %}
<script>
    $(document).ready(function () {
        $('#id_departments').select2({
            theme: 'bootstrap-5',
            placeholder: "Search for a department...",
            allowClear: true
        });
    });
</script>
{% endblock %}
